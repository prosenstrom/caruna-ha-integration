[project]
name = "caruna-ha-integration"
version = "1.2.0"
description = "Home Assistant custom integration for Caruna+ metering data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pycaruna @ git+https://github.com/prosenstrom/pycaruna.git@811cad65359c1afc8c3b89b6331cb3e823a4cd16",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6",
    "ruff>=0.12",
]
ha = [
    "pytest-asyncio>=1.0 ; python_full_version >= '3.14.2'",
    "pytest-homeassistant-custom-component>=0.13.356 ; python_full_version >= '3.14.2'",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv", "hass"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=custom_components/caruna",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
known-third-party = ["pycaruna", "voluptuous"]
combine-as-imports = true
