[project]
name = "caruna-ha-integration"
version = "1.2.0"
description = "Home Assistant custom integration for Caruna+ metering data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pycaruna @ git+https://github.com/prosenstrom/pycaruna.git@v1.1.1",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
known-third-party = ["pycaruna", "voluptuous"]
combine-as-imports = true
